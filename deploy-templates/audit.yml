# =============================================================================
#  Rent95 — Flutter Audit CI
# -----------------------------------------------------------------------------
#  Runs the full audit pipeline (scripts/audit.sh) on every PR + push to main.
#  Uses subosito/flutter-action stable channel + dependency cache to keep
#  wall-clock under ~4 min after the first warm run.
#
#  Ship: rename this file to .github/workflows/audit.yml in your local
#  checkout, commit, push. (Kept in deploy-templates/ so the Arena GitHub
#  App — which lacks the `workflows` scope — can't accidentally clobber it.)
# =============================================================================

name: Flutter Audit

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "deploy-templates/**"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_build:
        description: "Run Phase 6 (build + size profile)"
        type: boolean
        default: true

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "stable"      # subosito/flutter-action resolves latest stable
  JAVA_VERSION: "17"
  # Silence Dart pub analytics on CI
  PUB_ENVIRONMENT: "bot.github"

jobs:
  # ---------------------------------------------------------------------------
  # Fast phases (1-5) — every PR, every branch. Blocks merge on failure.
  # ---------------------------------------------------------------------------
  quality:
    name: Quality Gate (Phases 1-5)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter (${{ env.FLUTTER_VERSION }})
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-${{ hashFiles('**/pubspec.lock', '**/pubspec.yaml') }}"

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock', '**/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Print environment
        run: |
          flutter --version
          dart --version
          echo "Repo: ${{ github.repository }}"
          echo "Ref:  ${{ github.ref }}"
          echo "SHA:  ${{ github.sha }}"

      - name: Make audit script executable
        run: chmod +x scripts/audit.sh

      - name: Run audit (phases 1-5, no build)
        run: ./scripts/audit.sh --skip-build
        env:
          SKIP_BUILD: "1"
          # Fail loudly rather than warn on missing native audit tools:
          AUDIT_INSTALL_PANA: "0"

      - name: Run tests
        run: flutter test --coverage --reporter=expanded

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: build/audit/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Slow phase (6) — build + size profile. Runs on push to main + weekly.
  # PR runs it only when the branch has the "size" label.
  # ---------------------------------------------------------------------------
  size-profile:
    name: Build & Size Profile (Phase 6)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'size')
    strategy:
      fail-fast: false
      matrix:
        platform: [apk, aab]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter (${{ env.FLUTTER_VERSION }})
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      - name: Build ${{ matrix.platform }} with --analyze-size
        run: |
          chmod +x scripts/audit.sh
          ./scripts/audit.sh --skip-build || true  # env only, phases 1-5 already gated
          flutter build ${{ matrix.platform }} \
            --release \
            --analyze-size \
            --target-platform=android-arm64

      - name: Copy size-analysis JSON
        run: |
          mkdir -p build/audit
          find build -type f -name '*-code-size-analysis*.json' \
            -exec cp {} build/audit/size-${{ matrix.platform }}.json \;

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-size-report
          path: |
            build/audit/size-${{ matrix.platform }}.json
            build/app/outputs/**/*.apk
            build/app/outputs/**/*.aab
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Optional: nightly scheduled audit against main to catch dep drift + CVEs.
  # ---------------------------------------------------------------------------
  # Uncomment to enable:
  # nightly:
  #   name: Nightly Dependency Drift
  #   if: github.event_name == 'schedule'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: subosito/flutter-action@v2
  #       with: { channel: stable, cache: true }
  #     - run: chmod +x scripts/audit.sh && ./scripts/audit.sh --skip-build
