# Template — copy this file to .github/workflows/mobile-release.yml on your
# own clone to activate the workflow. It's shipped under deploy-templates/
# rather than .github/workflows/ because the sandbox that authored this
# repo doesn't have GitHub App `workflows` permission and can't commit
# directly into that path.
#
# Activate on your machine:
#
#   mkdir -p .github/workflows
#   cp deploy-templates/mobile-release.yml .github/workflows/mobile-release.yml
#   git add .github/workflows/mobile-release.yml
#   git commit -m 'chore: activate mobile release workflow'
#   git push
#
# The equivalent workflow files for rent95-api and rent95-admin are already
# committed inside their respective tarballs (rent95-api.tar.gz,
# rent95-admin.tar.gz) and will activate the moment you push those repos
# from your own machine — your credentials have the workflows scope.
# ---------------------------------------------------------------------

name: Mobile release

on:
  # Trigger from the Actions tab. We deliberately do NOT auto-release on
  # every push to main — store submissions have real cost (review delays,
  # metadata review, phased rollouts) and want a human in the loop.
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which store to ship to'
        required: true
        type: choice
        options:
          - android-beta
          - android-release
          - ios-beta
          - ios-release

jobs:
  android:
    if: startsWith(inputs.platform, 'android')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Restore Play Store JSON key
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          echo "$PLAY_STORE_JSON_KEY" > play-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$PWD/play-key.json" >> $GITHUB_ENV

      - name: Restore Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Fastlane
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SOCKET_URL: ${{ vars.SOCKET_URL }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ "${{ inputs.platform }}" = "android-beta" ]; then
            bundle exec fastlane android beta
          else
            bundle exec fastlane android release
          fi

  ios:
    if: startsWith(inputs.platform, 'ios')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Restore Apple certificates via Match
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          # Fastlane match pulls signed certs from a private git repo. See
          # docs/DEPLOY.md#ios-code-signing for setup.
          echo "Configure match locally first; CI reuses the same profile."

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Fastlane
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ITC_TEAM_ID: ${{ secrets.APPLE_ITC_TEAM_ID }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SOCKET_URL: ${{ vars.SOCKET_URL }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ "${{ inputs.platform }}" = "ios-beta" ]; then
            bundle exec fastlane ios beta
          else
            bundle exec fastlane ios release
          fi
